name: build-kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    # 快速 dtb 语法/引用校验 (~3 分钟), 失败则不进全量构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev
      - name: Clone mainline (shallow)
        run: git clone --depth 1 https://github.com/torvalds/linux.git linux
      - name: Apply z40pro board
        run: |
          cp kernel-patch/arch/arm64/boot/dts/qcom/sm8450-nubia-z40pro.dts \
             linux/arch/arm64/boot/dts/qcom/
          python3 scripts/patch_makefile.py linux/arch/arm64/boot/dts/qcom/Makefile
      - name: Compile dtb only
        run: |
          cd linux
          make ARCH=arm64 defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            qcom/sm8450-nubia-z40pro.dtb

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev cpio gzip python3

      - name: Clone mainline (shallow)
        run: git clone --depth 1 https://github.com/torvalds/linux.git linux

      - name: Apply z40pro board
        run: |
          cp kernel-patch/arch/arm64/boot/dts/qcom/sm8450-nubia-z40pro.dts \
             linux/arch/arm64/boot/dts/qcom/
          python3 scripts/patch_makefile.py linux/arch/arm64/boot/dts/qcom/Makefile

      - name: Configure
        run: |
          cd linux
          make ARCH=arm64 defconfig
          scripts/kconfig/merge_config.sh -m arch/arm64/configs/defconfig \
            ../kernel-patch/z40pro.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build
        run: |
          cd linux
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs
          cp arch/arm64/boot/Image ../out-Image
          cp arch/arm64/boot/dts/qcom/sm8450-nubia-z40pro.dtb ../out-z40pro.dtb

      - name: Assemble boot.img
        run: bash scripts/build-initramfs.sh out-z40pro.dtb out-Image out

      - name: Upload to release (bypass artifact storage quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}"             --title "build v${{ github.run_number }}"             --notes "kernel=$(cd linux && make kernelversion 2>/dev/null || echo mainline)"             --latest || true
          gh release upload "v${{ github.run_number }}"             out/boot.img out-Image out-z40pro.dtb --clobber
