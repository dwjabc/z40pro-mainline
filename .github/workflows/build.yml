name: build-kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev cpio gzip python3

      - name: Clone mainline (shallow)
        run: git clone --depth 1 https://github.com/torvalds/linux.git linux

      - name: Apply z40pro board
        run: |
          cp kernel-patch/arch/arm64/boot/dts/qcom/sm8450-nubia-z40pro.dts \
             linux/arch/arm64/boot/dts/qcom/
          python3 scripts/patch_makefile.py linux/arch/arm64/boot/dts/qcom/Makefile

      - name: Configure
        run: |
          cd linux
          make ARCH=arm64 defconfig
          scripts/kconfig/merge_config.sh -m arch/arm64/configs/defconfig \
            ../kernel-patch/z40pro.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build
        run: |
          cd linux
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz dtbs
          cp arch/arm64/boot/Image.gz ../out-Image.gz
          cp arch/arm64/boot/dts/qcom/sm8450-nubia-z40pro.dtb ../out-z40pro.dtb

      - name: Assemble boot.img
        run: bash scripts/build-initramfs.sh out-z40pro.dtb out-Image.gz out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: z40pro-boot-v${{ github.run_number }}
          path: |
            out/boot.img
            out-Image.gz
            out-z40pro.dtb
          if-no-files-found: error
